name: Build MX Location Pro Real Venue Photos 4.9.4

on:
  push:
    branches:
      - codex/mx-dating-v4-4-fullscreen-adults
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mx-dating-v44-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout MX Location repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.2"

      - name: Checkout pinned Locus
        shell: bash
        run: |
          set -euo pipefail
          git config --global http.version HTTP/1.1
          for attempt in 1 2 3 4; do
            git clone https://github.com/ChrisMack32/Locus.git Locus-src && break || sleep 10
          done
          test -d Locus-src/.git
          git -C Locus-src checkout 83c8fb324983728e8f44759cfd834dc637ee38b5

      - name: Apply stable MX engine and Dating Edition
        shell: bash
        run: |
          set -euo pipefail
          swift scripts/render_user_mx_icon.swift assets/MXAppIcon1024.png
          python3 scripts/patch_locus_direct.py Locus-src
          python3 scripts/patch_clean_ui_v123.py Locus-src
          python3 scripts/patch_v126_features.py Locus-src
          python3 scripts/patch_v127_features.py Locus-src
          python3 scripts/patch_v128_features.py Locus-src
          python3 scripts/patch_v129_features.py Locus-src
          python3 scripts/patch_v130_features.py Locus-src
          python3 scripts/patch_v131_features.py Locus-src
          python3 scripts/patch_v132_features.py Locus-src
          python3 scripts/patch_v132_restore_helpers.py Locus-src
          python3 scripts/patch_v133_features.py Locus-src
          python3 scripts/patch_v140_worlds.py Locus-src
          python3 scripts/patch_v141_features.py Locus-src
          python3 scripts/patch_v142_features.py Locus-src
          python3 scripts/patch_mx_pro.py Locus-src
          python3 scripts/patch_dating_edition.py Locus-src
          cp assets/MXAppIcon1024.png Locus-src/Locus/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          python3 - <<'PY'
          from pathlib import Path
          p=Path("Locus-src/project.yml")
          s=p.read_text()
          assert 'MARKETING_VERSION: "4.0.0"' in s
          p.write_text(s.replace('MARKETING_VERSION: "4.0.0"', 'MARKETING_VERSION: "4.9.4"').replace('CURRENT_PROJECT_VERSION: "40"', 'CURRENT_PROJECT_VERSION: "94"'))
          PY

      - name: Validate fullscreen Adults 18+ and smooth results
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          shell = Path('Locus-src/Locus/Features/Map/MXProPremiumShell.swift').read_text()
          edition = Path('Locus-src/Locus/Features/Map/MXDatingEdition.swift').read_text()
          assert 'MXPremiumCategoryScreen(category: navigation.category)' in edition
          assert '.toolbar(.hidden, for: .navigationBar)' in shell
          assert '.toolbar(.hidden, for: .tabBar)' in shell
          assert 'mxFloatingFullscreenHeader' in shell
          assert 'mxCompactFloatingVenueFilters' in shell
          assert 'mxNearbyThreeDetentSheet' in shell
          assert '.updating($draggingSheet)' in shell
          assert 'gesture.predictedEndTranslation.height' in shell
          assert 'radiusVisible.toggle()' in shell
          assert 'resultsSheet(availableHeight:' in shell
          assert 'sheetExpanded' not in shell
          print('Fullscreen header, venue filters and physics-based bottom sheet verified')
          PY

      - name: Check brief top toast and fully restored Favorites/Wingman
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Locus-src/Locus/Features/Map')
          root = (p/'RootView.swift').read_text()
          map_home = (p/'MapHomeView.swift').read_text()
          wingman = (p/'MXDatingEdition.swift').read_text()
          premium = (p/'MXProPremiumShell.swift').read_text()
          assert 'MXSavedView(selectedTab: $navigation.tab)' in (p/'MXProPremiumShell.swift').read_text(), 'Saved tab missing'
          assert 'mxAddFavoriteToSaved' not in root, 'Redundant top-right Favorites star still present'
          assert '.navigationTitle("Favorites")' in root, 'Favorites title lost'
          assert 'MXSavedView(selectedTab: $navigation.tab)' in premium, 'Saved tab must remain'
          assert 'moveFavorite(sourceID:' in root, 'Reorder lost'
          assert 'renameFavorite(' in root, 'Rename lost'
          assert 'MXWorldListRow(' in root and 'context.weather?.description' in (p/'MXWorlds.swift').read_text(), 'Weather row missing'
          assert 'worldActiveBanner(world)' in map_home
          assert '        .overlay(alignment: .top)' in map_home, 'Toast not on top overlay'
          assert '2_700_000_000' not in map_home, 'Old toast timing'
          assert '1_900_000_000' in map_home, 'Brief toast timing missing'
          assert 'case afterDark = "Confident 18+"' in wingman
          assert 'chatContext' in wingman and 'goal.rawValue' in wingman, 'Wingman improvements missing'
          assert '"Kink Events"' in premium and '"Fetish Clubs"' in premium
          print('Top toast, Saved reordering/editing/weather, Wingman and adults categories verified.')
          PY

      - name: Verify keyboard-safe searchable map and unobstructed suggestions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("Locus-src/Locus/Features/Map")
          map_home=(p/"MapHomeView.swift").read_text()
          dating=(p/"MXDatingEdition.swift").read_text()
          premium=(p/"MXProPremiumShell.swift").read_text()
          assert 'GeometryReader { searchLayout in' in map_home, "Map does not constrain keyboard search layout"
          assert 'searchResults(maxHeight:' in map_home, "Search list not height bounded"
          assert 'mxSearchScrollableResults' in map_home, "Scrollable results missing"
          assert 'LazyVStack(spacing: 0)' in map_home, "Search results are not lazy"
          assert 'mxSearchKeyboardDone' in map_home, "Keyboard dismissal action missing"
          assert 'if !searchFocused {' in map_home, "Map controls not hidden during search"
          assert 'premiumNavigation.isSearchActive = focused' in map_home
          assert 'navigation.isSearchActive ? 0 : 1' in dating, "Overlapping category chips not hidden"
          assert '@Published var isSearchActive' in premium, "Shared search state missing"
          assert 'mxFloatingFullscreenHeader' in premium, "Adults immersive screen missing"
          print("Keyboard-safe scroll results, pinned search field, restored map and category visibility checked")
          PY

      - name: Check native Apple and OpenStreetMap/MapLibre integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path("Locus-src")
          p=root/"Locus/Features/Map"
          project=(root/"project.yml").read_text()
          maplibre=(p/"MXOpenStreetMapProvider.swift").read_text()
          premium=(p/"MXProPremiumShell.swift").read_text()
          map_home=(p/"MapHomeView.swift").read_text()
          dating=(p/"MXDatingEdition.swift").read_text()
          assert 'exactVersion: 6.31.0' in project and 'product: MapLibre' in project
          assert 'GoogleMaps' not in project and 'product: GoogleMaps' not in project
          assert 'import MapLibre' in maplibre and 'MLNMapView(frame: .zero, styleURL:' in maplibre
          assert 'https://tiles.openfreemap.org/styles/liberty' in maplibre
          assert 'MXOpenStreetMapCanvas(' in map_home and 'MapReader { proxy in' in map_home
          assert 'session.pin' in map_home and 'session.simulated' in map_home
          assert 'MXMapChoiceStore()' in premium and '.environmentObject(mapChoice)' in premium
          assert 'MXMapSettingsScreen()' in premium and 'Label("Settings"' in premium
          assert 'MXMapProviderPicker()' not in dating, "Map switch leaked into Explore"
          assert 'Google Maps' not in dating, "Google map option survived"
          assert 'Remember my choice' in maplibre
          assert 'mxMapProviderSettingsPicker' in maplibre
          assert 'map.attributionButton.isHidden = false' in maplibre
          print('Settings-only Apple/OpenStreetMap switch, native MapLibre and zero Google SDK verified.')
          PY

      - name: Check natural-color full-screen maps and venues
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Locus-src/Locus/Features/Map')
          provider=(p/'MXOpenStreetMapProvider.swift').read_text()
          map_home=(p/'MapHomeView.swift').read_text()
          shell=(p/'MXProPremiumShell.swift').read_text()
          section=shell[shell.index('struct MXPremiumCategoryScreen: View {'):shell.index('struct MXPremiumSavedScreen: View {')]
          assert 'https://tiles.openfreemap.org/styles/liberty' in provider
          assert 'https://tiles.openfreemap.org/styles/dark' not in provider
          assert 'struct MXOpenStreetVenueMapCanvas' in provider
          assert 'func mapView(_ mapView: MLNMapView, didSelect annotation:' in provider
          assert '.ignoresSafeArea(.container, edges: [.top, .bottom])' in map_home
          assert 'mapChoice.selected == .osm' in section
          assert 'MXOpenStreetVenueMapCanvas(' in section
          assert '.ignoresSafeArea(.container, edges: .all)' in section
          assert 'selectedVenue = item' in section
          assert 'mapPosition = .region(' in section
          assert '.environment(\\.colorScheme, .dark)' in section
          assert 'MXMapProviderPicker' not in section
          assert 'MXMapSettingsScreen()' in shell
          assert 'Apple Maps' in provider and 'OpenStreetMap' in provider
          assert 'MapReader { proxy in' in map_home
          print('Natural-color OpenFreeMap, full-bleed category and Settings-only map choice verified.')
          PY

      - name: Validate Self Care and source-backed venue details
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("Locus-src/Locus/Features/Map")
          shell=(p/"MXProPremiumShell.swift").read_text()
          profile=(p/"MXVenueEnrichment.swift").read_text()
          photo=(p/"MXVenuePhotos.swift").read_text()
          edition=(p/"MXDatingEdition.swift").read_text()
          assert 'selfCare' in shell and 'case .selfCare:' in shell, 'self-care category missing'
          assert '"Foot Spa"' in shell and '"Massage"' in shell and '"Nails"' in shell
          assert '"security"' in shell and '"allied services"' in shell, 'Adult venue false positive filter missing'
          assert 'MXVenuePhotoGallery(item: item)' in shell and 'MXVenueContactDetails(item: item)' in shell
          assert 'MXVenueRealThumbnail(item: item)' in shell and 'MXVenuePhotoGallery(item: item)' in shell
          assert 'mxRealVenueSwipeGallery' in profile and 'mxCopyLatLong' in profile
          assert 'MXVenuePhotoLibrary' in photo and 'MXVenueRealThumbnail' in photo
          assert 'metadataImages(' in photo and 'imagesFromWebsite(' in photo
          assert 'normalized(found) == normalized(name)' in profile
          gallery=profile[profile.index('struct MXVenuePhotoGallery: View {'):profile.index('struct MXVenueContactDetails: View {')]
          assert 'mapPreview' not in gallery and 'streetView' not in gallery, 'Map or street preview leaked into photo gallery'
          assert 'MXVenueRealThumbnail(item: item)' in shell, 'Nearby rows still not using actual photos'
          assert 'https://tiles.openfreemap.org/styles/liberty' in (p/'MXOpenStreetMapProvider.swift').read_text()
          print('Photo-only previews, official website source lookup and dark Apple maps checked.')
          assert 'contact:whatsapp' in profile and 'contact:facebook' in profile
          assert 'normalized(found) == normalized(name)' in profile, 'Unverified OSM identity match'
          assert '.fullScreenCover(isPresented: $navigation.openCategory)' in edition, 'Category must cover tab bar completely'
          assert 'MXOpenStreetVenueMapCanvas(' in shell and 'mxAppleNearbyFullscreen' in shell
          print('Self-care, realistic images, contact sources, coordinates, natural colors, and fullscreen verified')
          PY

      - name: Verify finite loading and prioritized venue photos
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("Locus-src/Locus/Features/Map")
          photos=(p/"MXVenuePhotos.swift").read_text()
          gallery=(p/"MXVenueEnrichment.swift").read_text()
          assert "armUIWatchdog(for: key)" in photos, "Venue photos can spin forever"
          assert "7_000_000_000" in photos, "Bounded loading deadline missing"
          assert "checked.insert(key)" in photos, "Fallback missing"
          assert "withTaskGroup(of: [MXVenueVisual].self)" in photos, "Photo sources still serial"
          assert "priorityRequests" in photos, "Selected venue cannot skip stalled queue"
          assert "wikidataPictures" in photos and "wikidataID" in gallery, "Verified Wikimedia fallback missing"
          assert "lastAttempted" in photos and "600" in photos, "Transient photo failure retry missing"
          assert "overpass-api.de" in gallery, "OSM fallback mirror missing"
          assert "googlePlacesPictures" in photos and "places:searchText" in photos, "Google Places provider not connected"
          settings = (p/"MXOpenStreetMapProvider.swift").read_text()
          assert "mxGooglePlacesPhotosKey" in settings, "Photo API key configuration missing"
          assert "load(item, priority: true)" in gallery, "Gallery not prioritized"
          assert "MXVenuePhotoSource.osmPictures" in photos and "MXVenuePhotoSource.websitePictures" in photos
          assert "mapPreview" not in gallery[gallery.index("struct MXVenuePhotoGallery"):gallery.index("struct MXVenueContactDetails")]
          print("Photo loading deadline, background results, immediate publishing and priority venue fetch OK")
          PY

      - name: Build for iPhone without code signing
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen
          cd Locus-src
          xcodegen generate
          xcodebuild -project Locus.xcodeproj -scheme Locus \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM='' \
            build 2>&1 | tee xcodebuild-mx-dating.log

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find Locus-src/build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP"
          mkdir -p "$RUNNER_TEMP/mx-v44/Payload"
          cp -R "$APP" "$RUNNER_TEMP/mx-v44/Payload/MXLocationPro.app"
          find "$RUNNER_TEMP/mx-v44/Payload/MXLocationPro.app" -type d -name _CodeSignature -prune -exec rm -rf {} + || true
          find "$RUNNER_TEMP/mx-v44/Payload/MXLocationPro.app" -name embedded.mobileprovision -type f -delete || true
          /usr/libexec/PlistBuddy -c 'Set :CFBundleDisplayName MX Location Pro' "$RUNNER_TEMP/mx-v44/Payload/MXLocationPro.app/Info.plist"
          (
            cd "$RUNNER_TEMP/mx-v44"
            zip -qry "$GITHUB_WORKSPACE/MX-Location-Pro-v4.9.4-unsigned.ipa" Payload -x '._*' '.DS_Store' '__MACOSX/*'
          )
          shasum -a 256 MX-Location-Pro-v4.9.4-unsigned.ipa > MX-Location-Pro-v4.9.4-unsigned.ipa.sha256

      - name: Upload installable artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MX-Location-Pro-Dating-v4.9.4
          path: |
            MX-Location-Pro-v4.9.4-unsigned.ipa
            MX-Location-Pro-v4.9.4-unsigned.ipa.sha256
            Locus-src/xcodebuild-mx-dating.log
          if-no-files-found: warn
