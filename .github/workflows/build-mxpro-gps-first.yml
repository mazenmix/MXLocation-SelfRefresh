name: Build MX Location Pro GPS First IPA
on:
  push:
    branches:
      - codex/mx-pro-global-vector-camera-lock-v432-20261017
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout isolated build branch
        uses: actions/checkout@v4
      - name: Select Apple Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.2"
      - name: Unpack audited GPS-first source and verify checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p MXLocationProV4
          base64 -D -i MXLocationProV4_payload.b64 -o "$RUNNER_TEMP/mx-source.zip"
          echo 'a2efa059846504a927c566c4465467a92d54c87d63fd09ddd47ec06c86af404e  '"$RUNNER_TEMP/mx-source.zip" | shasum -a 256 -c
          unzip -oq "$RUNNER_TEMP/mx-source.zip" -d MXLocationProV4
          test -f MXLocationProV4/Builder/patch_mxpro_v4.py
          test -f MXLocationProV4/Sources/MXPlaceExplorer.swift
      - name: Checkout pinned Locus and apply base GPS patches
        shell: bash
        run: |
          set -euo pipefail
          git config --global http.version HTTP/1.1
          git clone https://github.com/ChrisMack32/Locus.git Locus-src
          git -C Locus-src checkout 83c8fb324983728e8f44759cfd834dc637ee38b5
          swift scripts/render_user_mx_icon.swift assets/MXAppIcon1024.png
          python3 scripts/patch_locus_direct.py Locus-src
          python3 scripts/patch_clean_ui_v123.py Locus-src
          for v in 126 127 128 129 130 131 132; do
            python3 "scripts/patch_v${v}_features.py" Locus-src
          done
          python3 scripts/patch_v132_restore_helpers.py Locus-src
          python3 scripts/patch_v133_features.py Locus-src
          python3 scripts/patch_v140_worlds.py Locus-src
          python3 scripts/patch_v141_features.py Locus-src
          python3 scripts/patch_v142_features.py Locus-src
      - name: Inject Pro GPS-first modules and preserve bundle identity
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/pro_patch_compatibility.py MXLocationProV4/Builder/patch_mxpro_v4.py
          python3 scripts/install_pro_polish.py MXLocationProV4
          base64 -D -i short_stay_source_patch.b64 -o "$RUNNER_TEMP/shortstay.zip"
          echo '3625f4fecdaca4f61f41d9716760e54efb12a3c9d668551e02de9393ae94dd8e  '"$RUNNER_TEMP/shortstay.zip" | shasum -a 256 -c
          unzip -oq "$RUNNER_TEMP/shortstay.zip" -d MXLocationProV4
          base64 -D -i quality_v414_source_patch.b64 -o "$RUNNER_TEMP/quality-v414.zip"
          echo 'd9df01efd843698a624a4634e9c5993b81f447ab046e814e4b4fa13b792f1039  '"$RUNNER_TEMP/quality-v414.zip" | shasum -a 256 -c
          unzip -oq "$RUNNER_TEMP/quality-v414.zip" -d MXLocationProV4
          python3 MXLocationProV4/Tests/test_v414_contract.py
          swiftc -parse-as-library MXLocationProV4/Sources/MXExploreSearchPolicy.swift MXLocationProV4/Tests/test_search_policy.swift -o "$RUNNER_TEMP/quality-policy-test"
          "$RUNNER_TEMP/quality-policy-test"
          swiftc -parse-as-library MXLocationProV4/Sources/MXPlaceTaxonomy.swift MXLocationProV4/Tests/test_place_taxonomy.swift -o "$RUNNER_TEMP/shortstay-taxonomy-tests"
          "$RUNNER_TEMP/shortstay-taxonomy-tests"
          swiftc -parse-as-library MXLocationProV4/Sources/MXPlaceTaxonomy.swift MXLocationProV4/Tests/test_gps_first.swift -o "$RUNNER_TEMP/shortstay-gps-tests"
          "$RUNNER_TEMP/shortstay-gps-tests"
          python3 MXLocationProV4/Builder/patch_mxpro_v4.py Locus-src
          python3 scripts/patch_mx_google_maps_v415.py Locus-src
          python3 scripts/patch_mx_radius_v416.py Locus-src
          python3 scripts/patch_mx_radius_ring_v417.py Locus-src
          python3 scripts/patch_mx_floating_radius_v418.py Locus-src
          python3 scripts/patch_mx_radius_reposition_v419.py Locus-src
          python3 scripts/patch_mx_km_next_to_settings_v420.py Locus-src
          python3 scripts/patch_mx_signing_status_v421.py Locus-src
          python3 scripts/patch_mx_short_stay_color_v422.py Locus-src
          python3 scripts/patch_mx_retain_map_camera_v423.py Locus-src
          python3 scripts/patch_mx_camera_lock_v424.py Locus-src
          python3 scripts/patch_mx_genuine_renewal_v426.py Locus-src
          python3 scripts/patch_mx_restore_osm_v427.py Locus-src
          python3 scripts/patch_mx_map_settings_v428.py Locus-src
          python3 scripts/patch_mx_osm_smooth_v428.py Locus-src
          python3 scripts/patch_mx_full_bleed_global_v429.py Locus-src
          python3 scripts/patch_mx_global_previews_v429.py Locus-src
          python3 scripts/patch_mx_vector_3d_v430.py Locus-src
          python3 scripts/patch_mx_v431_fullscreen_vector.py Locus-src
          # v4.32: replace older raster secondary maps with the very same
          # vector/3D renderer used by the main map, and stop camera resets.
          cp overlays/MXVectorOSMMapView.swift Locus-src/Locus/Features/Map/MXVectorOSMMapView.swift
          cp overlays/MXOSMUniversalMap.swift Locus-src/Locus/Features/Map/MXOSMUniversalMap.swift
          python3 scripts/patch_mx_no_auto_zoom_v432.py Locus-src
          grep -Fq 'lastCamera?.distance ?? position.wrappedValue.camera?.distance' Locus-src/Locus/Features/Map/MXMapCameraMemory.swift
          grep -Fq 'MXVectorOSMStyle.ensure3DBuildings(in: style)' Locus-src/Locus/Features/Map/MXVectorOSMMapView.swift
          grep -Fq 'MXVectorOSMStyle.ensure3DBuildings(in: style)' Locus-src/Locus/Features/Map/MXOSMUniversalMap.swift
          grep -Fq 'let map = MLNMapView(' Locus-src/Locus/Features/Map/MXOSMUniversalMap.swift
          ! grep -Fq 'MKTileOverlay' Locus-src/Locus/Features/Map/MXOSMUniversalMap.swift
          grep -Fq 'map.setCenter(region.center, animated: false)' Locus-src/Locus/Features/Map/MXVectorOSMMapView.swift
          grep -Fq 'nativeViewport.v432' Locus-src/Locus/Features/Map/MXVectorOSMMapView.swift
          grep -Fq 'mxWindowSafeArea.top' Locus-src/Locus/Features/Map/MapHomeView.swift
          grep -Fq 'OpenStreetMap Vector 3D' Locus-src/Locus/Features/Settings/SettingsView.swift
          ! grep -Fq 'embed: true' Locus-src/project.yml
          grep -Fq 'MXVectorOSMMapView(' Locus-src/Locus/Features/Map/MapHomeView.swift
          grep -Fq 'MLNFillExtrusionStyleLayer' Locus-src/Locus/Features/Map/MXVectorOSMMapView.swift
          grep -Fq 'https://tiles.openfreemap.org/styles/liberty' Locus-src/Locus/Features/Map/MXVectorOSMMapView.swift
          grep -Fq 'MapLibreSDK:' Locus-src/project.yml
          grep -Fq 'distance: max(10, lastCamera?.distance' Locus-src/Locus/Features/Map/MXMapCameraMemory.swift
          grep -Fq 'lineWidth: option == .shortStay ? 1.7 : 0.7' Locus-src/Locus/Features/Map/MXPlaceExplorer.swift
          grep -Fq 'manualTeleportRevision' Locus-src/Locus/Engine/SpoofSession.swift
          grep -Fq '.ignoresSafeArea(.container, edges: [.top, .bottom])' Locus-src/Locus/Features/Map/MapHomeView.swift
          grep -Fq 'map.isPitchEnabled = true' Locus-src/Locus/Features/Map/MXOpenStreetMapView.swift
          grep -Fq 'MXOSMUniversalMap(' Locus-src/Locus/Features/Map/MXPlaceExplorer.swift
          grep -Fq 'MXUnifiedMapPreview(' Locus-src/Locus/Features/Map/MXWorlds.swift
          grep -Fq 'MXUnifiedMapPreview(' Locus-src/Locus/Features/Map/MXProToolbox.swift
          grep -Fq 'if mapProvider == "osm"' Locus-src/Locus/Features/Map/MXPlaceExplorer.swift
          grep -Fq 'Picker("Map Provider", selection: $mapProvider)' Locus-src/Locus/Features/Settings/SettingsView.swift
          grep -Fq 'openAppleTransit()' Locus-src/Locus/Features/Settings/SettingsView.swift
          grep -Fq 'apple3DRequest != apple3DHandled' Locus-src/Locus/Features/Map/MapHomeView.swift
          grep -Fq 'tiles.canReplaceMapContent = false' Locus-src/Locus/Features/Map/MXOpenStreetMapView.swift
          grep -Fq 'if context.coordinator.wasPublished(requested)' Locus-src/Locus/Features/Map/MXOpenStreetMapView.swift
          grep -Fq '© OpenStreetMap contributors' Locus-src/Locus/Features/Map/MapHomeView.swift
          ! grep -Fq 'private var mapLayerMenu' Locus-src/Locus/Features/Map/MapHomeView.swift
          ! grep -Fq 'MXOpenStreetMapView(' Locus-src/Locus/Features/Map/MapHomeView.swift
          grep -Fq '@AppStorage("mx.map.provider")' Locus-src/Locus/Features/Map/MapHomeView.swift
          grep -Fq '© OpenStreetMap contributors' Locus-src/Locus/Features/Map/MapHomeView.swift
          grep -Fq 'tile.openstreetmap.org/{z}/{x}/{y}.png' Locus-src/Locus/Features/Map/MXOpenStreetMapView.swift
          grep -Fq 'cameraMemory.save()' Locus-src/Locus/Features/Map/MXOpenStreetMapView.swift
          grep -Fq 'Map(position: $position)' Locus-src/Locus/Features/Map/MapHomeView.swift
          grep -Fq 'misagent_copy_all(misagent, &profiles, &lengths, &count)' Locus-src/Locus/Support/MXInstalledProvisionReader.swift
          grep -Fq 'session.manualTeleportRevision' Locus-src/Locus/Features/Map/RootView.swift
          grep -Fq 'manualTeleportRevision &+= 1' Locus-src/Locus/Engine/SpoofSession.swift
          grep -Fq 'Live installed provisioning profile' Locus-src/Locus/Features/Settings/SettingsView.swift
          ! grep -Fq 'userConfirmedRefreshAt' Locus-src/Locus/Features/Settings/SettingsView.swift
          grep -Fq 'cameraMemory.observe(context.camera)' Locus-src/Locus/Features/Map/MapHomeView.swift
          grep -Fq '.onMapCameraChange(frequency: .continuous)' Locus-src/Locus/Features/Map/MapHomeView.swift
          grep -Fq 'cameraMemory.lock($position)' Locus-src/Locus/Features/Map/MapHomeView.swift
          grep -Fq 'MapHomeView(position: $retainedMapCamera, cameraMemory: mapCameraMemory)' Locus-src/Locus/Features/Map/RootView.swift
          grep -Fq 'restoredFromDisk' Locus-src/Locus/Features/Map/MXMapCameraMemory.swift
          grep -Fq 'UserDefaults.standard.set([' Locus-src/Locus/Features/Map/MXMapCameraMemory.swift
          grep -Fq '@Binding var position: MapCameraPosition' Locus-src/Locus/Features/Map/MapHomeView.swift
          grep -Fq 'Map(position: $position)' Locus-src/Locus/Features/Map/MapHomeView.swift
          ! grep -Fq '@State private var position: MapCameraPosition' Locus-src/Locus/Features/Map/MapHomeView.swift
          grep -Fq 'Text("Renew Certificate")' Locus-src/Locus/Features/Settings/SettingsView.swift
          grep -Fq 'Embedded profile only. SideStore refresh may have a newer installed expiry.' Locus-src/Locus/Features/Settings/SettingsView.swift
          grep -Fq 'shortStayTurquoise' Locus-src/Locus/Features/Map/MXPlaceExplorer.swift
          grep -Fq 'ForEach([1.0, 3.0, 5.0, 10.0, 15.0], id: \.self)' Locus-src/Locus/Features/Map/RootView.swift
          ! grep -Fq 'Your SideStore signing expires soon.' Locus-src/Locus/Support/MXExpiryReminder.swift
          grep -Fq 'session.teleport(to: place.coordinate, pairing: pairing)' Locus-src/Locus/Features/Map/MXPlaceExplorer.swift
          grep -Fq 'if selectedTab == 3 {' Locus-src/Locus/Features/Map/RootView.swift
          grep -Fq 'private var placesRadiusMenu: some View' Locus-src/Locus/Features/Map/RootView.swift
          grep -Fq '@AppStorage("mx.places.radiusKM")' Locus-src/Locus/Features/Map/MXPlaceExplorer.swift
          grep -Fq 'MapCircle(center: selectedCenter, radius: radiusKM * 1_000)' Locus-src/Locus/Features/Map/MXPlaceExplorer.swift
          ! grep -q 'private var radiusToolbar' Locus-src/Locus/Features/Map/MXPlaceExplorer.swift
          grep -q 'MapCircle(center: selectedCenter, radius: radiusKM \* 1_000)' Locus-src/Locus/Features/Map/MXPlaceExplorer.swift
          grep -Fq 'ForEach([1.0, 5.0, 10.0, 15.0], id: \.self)' Locus-src/Locus/Features/Map/MXProDiscovery.swift
          grep -q 'MXGoogleMapsLauncher.open(coordinate: place.coordinate)' Locus-src/Locus/Features/Map/MXProDiscovery.swift
          grep -q 'comgooglemaps://' Locus-src/Locus/Features/Map/MXGoogleMapsLauncher.swift
          grep -q 'https://www.google.com/maps/search/' Locus-src/Locus/Features/Map/MXGoogleMapsLauncher.swift
          ! grep -q 'openInMaps(' Locus-src/Locus/Features/Map/MXProDiscovery.swift
          cp MXLocationProV4/Assets/MXProIcon1024.png Locus-src/Locus/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          xcrun swiftc -frontend -parse MXLocationProV4/Sources/*.swift
      - name: Build matching iDevice FFI library with installed-profile support
        shell: bash
        run: |
          set -euo pipefail
          git init idevice-upstream
          git -C idevice-upstream remote add origin https://github.com/jkcoxson/idevice.git
          git -C idevice-upstream fetch --depth 1 origin 3854a5df4a5a6dee71ffce4d8befc2ea356a8065
          git -C idevice-upstream checkout --detach FETCH_HEAD
          rustup target add aarch64-apple-ios
          export CARGO_PROFILE_RELEASE_LTO=false
          export CARGO_PROFILE_RELEASE_CODEGEN_UNITS=8
          export IPHONEOS_DEPLOYMENT_TARGET=17.0
          export CARGO_TARGET_AARCH64_APPLE_IOS_RUSTFLAGS="-C link-arg=-miphoneos-version-min=17.0"
          export CFLAGS_aarch64_apple_ios="-miphoneos-version-min=17.0"
          cargo build --manifest-path idevice-upstream/Cargo.toml -p idevice-ffi --target aarch64-apple-ios --release
          RUSTLIB=idevice-upstream/target/aarch64-apple-ios/release/libidevice_ffi.a
          test -s "$RUSTLIB"
          cp "$RUSTLIB" Locus-src/Vendor/idevice/libidevice_ffi.a
      - name: Build iOS IPA on macOS
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen
          cd Locus-src
          xcodegen generate
          xcodebuild -project Locus.xcodeproj -scheme Locus -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM='' build > "$GITHUB_WORKSPACE/xcodebuild-mxpro.log" 2>&1 || { tail -250 "$GITHUB_WORKSPACE/xcodebuild-mxpro.log"; exit 1; }
      - name: Package unsigned new Pro version
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find Locus-src/build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP"
          WORK="$RUNNER_TEMP/mx-pro-output"
          mkdir -p "$WORK/Payload"
          cp -R "$APP" "$WORK/Payload/MXLocationPro.app"
          # Native binary SPM products may be linked without being copied by
          # XcodeGen. Embed the correct arm64 framework into the unsigned
          # payload so SideStore can sign every dynamic library on install.
          TARGET="$WORK/Payload/MXLocationPro.app/Frameworks/MapLibre.framework"
          if [ ! -f "$TARGET/MapLibre" ]; then
            FRAMEWORK=$(find Locus-src/build -type d -path '*/ios-arm64/MapLibre.framework' -print -quit || true)
            if [ -z "$FRAMEWORK" ]; then
              FRAMEWORK=$(find Locus-src/build -type d -name 'MapLibre.framework' -not -path '*simulator*' -print -quit || true)
            fi
            test -n "$FRAMEWORK"
            mkdir -p "$(dirname "$TARGET")"
            cp -R "$FRAMEWORK" "$TARGET"
          fi
          test -s "$TARGET/MapLibre"
          echo "PASS: MapLibre vector 3D dynamic framework bundled for SideStore"
          python3 - "$WORK/Payload/MXLocationPro.app/Info.plist" <<'PY'
          import plistlib,sys
          p=sys.argv[1]
          with open(p,'rb') as f: d=plistlib.load(f)
          assert d.get('CFBundleIdentifier')=='com.mazenmix.mxlocationpro',d.get('CFBundleIdentifier')
          assert d.get('CFBundleDisplayName')=='MX Location Pro'
          d['CFBundleShortVersionString']='4.31.0'
          d['CFBundleVersion']='320'
          with open(p,'wb') as f: plistlib.dump(d,f)
          PY
          find "$WORK/Payload/MXLocationPro.app" -type d -name _CodeSignature -prune -exec rm -rf {} +
          find "$WORK/Payload/MXLocationPro.app" -type f -name embedded.mobileprovision -delete
          (cd "$WORK" && zip -qry "$GITHUB_WORKSPACE/MX-Location-Pro-GPS-First-v4.32.0-unsigned.ipa" Payload)
          shasum -a 256 MX-Location-Pro-GPS-First-v4.32.0-unsigned.ipa > MX-Location-Pro-GPS-First-v4.32.0-unsigned.ipa.sha256
      - name: Upload IPA and build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MX-Location-Pro-GPS-First-v4.32.0
          path: |
            MX-Location-Pro-GPS-First-v4.32.0-unsigned.ipa
            MX-Location-Pro-GPS-First-v4.32.0-unsigned.ipa.sha256
            xcodebuild-mxpro.log
          if-no-files-found: ignore
