name: Build MX Location Guest Framework

on:
  push:
    branches:
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mx-guest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-guest:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.2"

      - name: Checkout pinned Locus source
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/ChrisMack32/Locus.git Locus-src
          git -C Locus-src checkout 83c8fb324983728e8f44759cfd834dc637ee38b5

      - name: Apply MX Location patches
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_locus.py Locus-src
          python3 scripts/clean_settings.py Locus-src
          python3 scripts/patch_locus_profiles_notifications.py Locus-src
          cp assets/MXAppIcon1024.png Locus-src/Locus/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen ldid
          curl -fL --retry 3 -o dylibify https://github.com/LiveContainer/dylibify/releases/download/1.0/dylibify
          chmod +x dylibify

      - name: Build MX Location guest
        shell: bash
        run: |
          set -euo pipefail
          cd Locus-src
          xcodegen generate
          xcodebuild \
            -project Locus.xcodeproj \
            -scheme Locus \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM='' \
            build | tee xcodebuild-locus.log

      - name: Convert guest to LiveContainer framework
        shell: bash
        run: |
          set -euo pipefail
          LOCUS_APP=$(find Locus-src/build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$LOCUS_APP"
          mkdir -p out
          cp -R "$LOCUS_APP" out/MXLocationApp.framework
          MX_EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' out/MXLocationApp.framework/Info.plist)
          ./dylibify "out/MXLocationApp.framework/$MX_EXECUTABLE" "out/MXLocationApp.framework/$MX_EXECUTABLE.dylib"
          rm "out/MXLocationApp.framework/$MX_EXECUTABLE"
          mv "out/MXLocationApp.framework/$MX_EXECUTABLE.dylib" "out/MXLocationApp.framework/$MX_EXECUTABLE"
          ldid -S"" "out/MXLocationApp.framework/$MX_EXECUTABLE"
          cp scripts/LCAppInfo-MX.plist out/MXLocationApp.framework/LCAppInfo.plist 2>/dev/null || cp LCAppInfo-MX.plist out/MXLocationApp.framework/LCAppInfo.plist 2>/dev/null || cp scripts/../scripts/LCAppInfo-MX.plist out/MXLocationApp.framework/LCAppInfo.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' out/MXLocationApp.framework/Info.plist
          strings "out/MXLocationApp.framework/$MX_EXECUTABLE" | grep -F 'MX Location Pairing Code'
          strings "out/MXLocationApp.framework/$MX_EXECUTABLE" | grep -F 'MX Location Stopped'
          strings "out/MXLocationApp.framework/$MX_EXECUTABLE" | grep -F 'Save Current as Profile'
          strings "out/MXLocationApp.framework/$MX_EXECUTABLE" | grep -F 'MazenmiX'
          ditto -c -k --sequesterRsrc --keepParent out/MXLocationApp.framework MXLocationApp-framework-v1.0.3.zip

      - name: Upload guest framework
        uses: actions/upload-artifact@v4
        with:
          name: MXLocationApp-framework-v1.0.3
          path: |
            MXLocationApp-framework-v1.0.3.zip
            Locus-src/xcodebuild-locus.log
          if-no-files-found: error
