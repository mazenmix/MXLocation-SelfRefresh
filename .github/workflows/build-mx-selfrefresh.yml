name: Build MX Location Travel Dating Suite

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mx-travel-suite-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.2"

      - name: Checkout pinned Locus source
        shell: bash
        run: |
          set -euo pipefail
          git config --global http.version HTTP/1.1
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 60
          retry() {
            local attempts=5
            local delay=8
            local n=1
            until "$@"; do
              if [ "$n" -ge "$attempts" ]; then
                echo "Command failed after $attempts attempts: $*" >&2
                return 1
              fi
              echo "Network attempt $n failed; retrying in ${delay}s..." >&2
              n=$((n + 1))
              sleep "$delay"
              delay=$((delay * 2))
            done
          }
          retry git clone https://github.com/ChrisMack32/Locus.git Locus-src
          git -C Locus-src checkout 83c8fb324983728e8f44759cfd834dc637ee38b5

      - name: Apply MX Location travel and dating build
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_locus_direct.py Locus-src
          python3 scripts/patch_quick_places.py Locus-src
          python3 scripts/patch_travel_suite.py Locus-src
          python3 scripts/patch_waze.py Locus-src

          # Locus ships both an AppIcon.icon (Icon Composer package) and an
          # AppIcon.appiconset. The Icon Composer package was winning, which is
          # why iOS kept showing the old coloured map-pin icon. Remove that
          # package from the generated project so MX's AppIcon.appiconset is the
          # single launcher-icon source.
          rm -rf Locus-src/AppIcon.icon
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Locus-src/project.yml')
          s = p.read_text()
          s = s.replace('      - path: AppIcon.icon\n', '')
          s = s.replace('        MARKETING_VERSION: "1.0.2"', '        MARKETING_VERSION: "1.1.1"')
          s = s.replace('        CURRENT_PROJECT_VERSION: "3"', '        CURRENT_PROJECT_VERSION: "4"')
          p.write_text(s)
          PY

          # Use MX's black/white 1024px artwork as the only AppIcon asset.
          cp assets/MXAppIcon1024.png Locus-src/Locus/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png

          # Fail early if the old Icon Composer source can still be referenced.
          if grep -q 'path: AppIcon.icon' Locus-src/project.yml; then
            echo 'Old AppIcon.icon is still referenced' >&2
            exit 1
          fi
          test -f Locus-src/Locus/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png

      - name: Install build dependency
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen

      - name: Build unsigned MX Location
        shell: bash
        run: |
          set -euo pipefail
          cd Locus-src
          xcodegen generate
          xcodebuild \
            -project Locus.xcodeproj \
            -scheme Locus \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM='' \
            build | tee xcodebuild-navigation.log

      - name: Package direct IPA
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find Locus-src/build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP"
          test -d "$APP"
          WORK="$RUNNER_TEMP/mx-location-package"
          rm -rf "$WORK"
          mkdir -p "$WORK/Payload"
          cp -R "$APP" "$WORK/Payload/MXLocation.app"
          find "$WORK/Payload/MXLocation.app" -type d -name _CodeSignature -prune -exec rm -rf {} + || true
          find "$WORK/Payload/MXLocation.app" -name embedded.mobileprovision -type f -delete || true
          /usr/libexec/PlistBuddy -c 'Set :CFBundleDisplayName MX Location' "$WORK/Payload/MXLocation.app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleName MXLocation' "$WORK/Payload/MXLocation.app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleShortVersionString 1.1.1' "$WORK/Payload/MXLocation.app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleVersion 4' "$WORK/Payload/MXLocation.app/Info.plist"

          # Verify the asset compiler emitted launcher PNGs into the app bundle.
          find "$WORK/Payload/MXLocation.app" -maxdepth 1 -type f \( -name 'AppIcon*.png' -o -name 'Assets.car' \) -print | tee "$GITHUB_WORKSPACE/icon-files.txt"
          test -s "$GITHUB_WORKSPACE/icon-files.txt"

          OUTPUT="$GITHUB_WORKSPACE/MX-Location-v1.1.1-Travel-Dating-Suite-MXIcon-unsigned.ipa"
          (
            cd "$WORK"
            /usr/bin/zip -qry "$OUTPUT" Payload -x '._*' '.DS_Store' '__MACOSX/*'
          )
          test -f "$OUTPUT"
          if unzip -l "$OUTPUT" | grep -Eiq 'SideStore|LiveContainer|SideStoreApp\.framework'; then
            echo "Unexpected renewal/host component found in direct IPA" >&2
            exit 1
          fi
          shasum -a 256 "$OUTPUT" > "$OUTPUT.sha256"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MX-Location-v1.1.1-Travel-Dating-Suite-MXIcon
          path: |
            MX-Location-v1.1.1-Travel-Dating-Suite-MXIcon-unsigned.ipa
            MX-Location-v1.1.1-Travel-Dating-Suite-MXIcon-unsigned.ipa.sha256
            Locus-src/xcodebuild-navigation.log
            icon-files.txt
          if-no-files-found: error
