name: Build MX Location Navigation IPA

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mx-navigation-direct-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.2"

      - name: Checkout pinned Locus source
        shell: bash
        run: |
          set -euo pipefail

          git config --global http.version HTTP/1.1
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 60

          retry() {
            local attempts=5
            local delay=8
            local n=1
            until "$@"; do
              if [ "$n" -ge "$attempts" ]; then
                echo "Command failed after $attempts attempts: $*" >&2
                return 1
              fi
              echo "Network attempt $n failed; retrying in ${delay}s..." >&2
              n=$((n + 1))
              sleep "$delay"
              delay=$((delay * 2))
            done
          }

          retry git clone https://github.com/ChrisMack32/Locus.git Locus-src
          git -C Locus-src checkout 83c8fb324983728e8f44759cfd834dc637ee38b5

      - name: Apply MX Location direct navigation build
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_locus_direct.py Locus-src
          python3 scripts/patch_waze.py Locus-src
          cp assets/MXAppIcon1024.png Locus-src/Locus/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png

      - name: Install build dependency
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen

      - name: Build unsigned MX Location
        shell: bash
        run: |
          set -euo pipefail
          cd Locus-src
          xcodegen generate
          xcodebuild \
            -project Locus.xcodeproj \
            -scheme Locus \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM='' \
            build | tee xcodebuild-navigation.log

      - name: Package direct IPA
        shell: bash
        run: |
          set -euo pipefail

          APP=$(find Locus-src/build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP"
          test -d "$APP"

          WORK="$RUNNER_TEMP/mx-location-package"
          rm -rf "$WORK"
          mkdir -p "$WORK/Payload"
          cp -R "$APP" "$WORK/Payload/MXLocation.app"

          find "$WORK/Payload/MXLocation.app" -type d -name _CodeSignature -prune -exec rm -rf {} + || true
          find "$WORK/Payload/MXLocation.app" -name embedded.mobileprovision -type f -delete || true

          /usr/libexec/PlistBuddy -c 'Set :CFBundleDisplayName MX Location' "$WORK/Payload/MXLocation.app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleName MXLocation' "$WORK/Payload/MXLocation.app/Info.plist"

          OUTPUT="$GITHUB_WORKSPACE/MX-Location-v1.0.11-Navigation-No-Renewal-unsigned.ipa"
          (
            cd "$WORK"
            /usr/bin/zip -qry "$OUTPUT" Payload -x '._*' '.DS_Store' '__MACOSX/*'
          )

          test -f "$OUTPUT"
          if unzip -l "$OUTPUT" | grep -Eiq 'SideStore|LiveContainer|SideStoreApp\.framework'; then
            echo "Unexpected renewal/host component found in direct IPA" >&2
            exit 1
          fi

          shasum -a 256 "$OUTPUT" > "$OUTPUT.sha256"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MX-Location-v1.0.11-Navigation-No-Renewal
          path: |
            MX-Location-v1.0.11-Navigation-No-Renewal-unsigned.ipa
            MX-Location-v1.0.11-Navigation-No-Renewal-unsigned.ipa.sha256
            Locus-src/xcodebuild-navigation.log
          if-no-files-found: error
