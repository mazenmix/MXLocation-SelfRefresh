name: Build MX Location Guest Framework

on:
  push:
    branches:
      - "codex/mx-minimal-theme-selfrefresh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mx-minimal-theme-framework-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.2"

      - name: Checkout pinned Locus
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/ChrisMack32/Locus.git Locus-src
          git -C Locus-src checkout 83c8fb324983728e8f44759cfd834dc637ee38b5

      - name: Apply MX changes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_locus.py Locus-src
          python3 scripts/clean_settings.py Locus-src
          python3 scripts/minimal_theme.py Locus-src assets/MXAppIcon1024.png
          cp assets/MXAppIcon1024.png Locus-src/Locus/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen ldid
          curl -fL --retry 3 -o dylibify https://github.com/LiveContainer/dylibify/releases/download/1.0/dylibify
          chmod +x dylibify

      - name: Build MX Location guest
        shell: bash
        run: |
          set -euo pipefail
          cd Locus-src
          xcodegen generate
          xcodebuild \
            -project Locus.xcodeproj \
            -scheme Locus \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM='' \
            build | tee xcodebuild-locus.log

      - name: Convert guest to LiveContainer framework
        shell: bash
        run: |
          set -euo pipefail
          LOCUS_APP=$(find Locus-src/build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$LOCUS_APP"
          test -d "$LOCUS_APP"
          cp -R "$LOCUS_APP" MXLocationApp.framework
          MX_EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' MXLocationApp.framework/Info.plist)
          ./dylibify "MXLocationApp.framework/$MX_EXECUTABLE" "MXLocationApp.framework/$MX_EXECUTABLE.dylib"
          rm "MXLocationApp.framework/$MX_EXECUTABLE"
          mv "MXLocationApp.framework/$MX_EXECUTABLE.dylib" "MXLocationApp.framework/$MX_EXECUTABLE"
          ldid -S"" "MXLocationApp.framework/$MX_EXECUTABLE"
          cp scripts/LCAppInfo-MX.plist MXLocationApp.framework/LCAppInfo.plist
          find MXLocationApp.framework -type d -name _CodeSignature -prune -exec rm -rf {} +
          find MXLocationApp.framework -name embedded.mobileprovision -type f -delete
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent MXLocationApp.framework MXLocationApp-framework.zip
          shasum -a 256 MXLocationApp-framework.zip > MXLocationApp-framework.zip.sha256

      - name: Upload framework
        uses: actions/upload-artifact@v4
        with:
          name: MXLocationApp-Minimal-Theme
          path: |
            MXLocationApp-framework.zip
            MXLocationApp-framework.zip.sha256
            Locus-src/xcodebuild-locus.log
          if-no-files-found: error
